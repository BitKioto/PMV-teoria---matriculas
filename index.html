<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Portal de Matrícula Académica</title>

<style>
/* Layout: launchpad empresarial — barra de shell oscura fija, grupos de tiles por rol, páginas de objeto con tablas densas */
:root{
  --shell:#1d2d3e; --shell-fg:#ffffff; --shell-muted:#a9b4be;
  --bg:#f5f6f7; --surface:#ffffff; --surface-2:#f2f4f6; --line:#d9dee3;
  --fg:#1d2d3e; --muted:#556b82; --accent:#0a6ed1; --accent-soft:#e5f0fa; --accent-fg:#ffffff;
  --pos:#107e3e; --pos-soft:#e8f4ec; --warn:#c35500; --warn-soft:#fef3e7; --neg:#bb0000; --neg-soft:#fbeaea; --info:#5d36ff;
  --font:"Source Sans 3","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:8px; --shadow:0 0 0 1px rgba(29,45,62,.06),0 2px 6px rgba(29,45,62,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --shell:#0b1218; --shell-fg:#eef2f5; --shell-muted:#8796a4;
  --bg:#12181e; --surface:#1b232b; --surface-2:#222c35; --line:#33404c;
  --fg:#e8edf1; --muted:#9fb0bf; --accent:#4db1ff; --accent-soft:#16324a; --accent-fg:#0b1218;
  --pos:#5fd38a; --pos-soft:#173726; --warn:#ffab5c; --warn-soft:#3a2a17; --neg:#ff7a7a; --neg-soft:#3d1c1e; --info:#a891ff;
  --shadow:0 0 0 1px rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --shell:#0b1218; --shell-fg:#eef2f5; --shell-muted:#8796a4;
  --bg:#12181e; --surface:#1b232b; --surface-2:#222c35; --line:#33404c;
  --fg:#e8edf1; --muted:#9fb0bf; --accent:#4db1ff; --accent-soft:#16324a; --accent-fg:#0b1218;
  --pos:#5fd38a; --pos-soft:#173726; --warn:#ffab5c; --warn-soft:#3a2a17; --neg:#ff7a7a; --neg-soft:#3d1c1e; --info:#a891ff;
  --shadow:0 0 0 1px rgba(255,255,255,.06),0 2px 8px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--shell)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.86em;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}

/* Shell bar */
.shell{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--shell);color:var(--shell-fg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.shell-in{height:52px;display:flex;align-items:center;gap:12px;max-width:1280px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:inherit;padding:4px 6px;border-radius:6px}
.brand:hover{background:rgba(255,255,255,.08)}
.logo{width:30px;height:22px;border-radius:4px;background:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--accent-fg);letter-spacing:.04em}
.brand b{font-weight:600;font-size:16px;white-space:nowrap}
.brand small{color:var(--shell-muted);font-size:13px}
.spacer{flex:1}
.sbtn{background:none;border:0;color:var(--shell-fg);cursor:pointer;height:36px;min-width:36px;border-radius:6px;display:grid;place-items:center;position:relative;padding:0 8px}
.sbtn:hover{background:rgba(255,255,255,.1)}
.badge{position:absolute;top:3px;right:2px;background:var(--neg);color:#fff;border-radius:9px;font-size:11px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.rolechip{font-size:12px;color:var(--shell-muted);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:2px 10px;white-space:nowrap}
@media (max-width:640px){.brand small,.rolechip{display:none}}

/* Page */
.page{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.crumbs{display:flex;gap:6px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.crumbs button{background:none;border:0;color:var(--accent);cursor:pointer;padding:0}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;margin:6px 0 18px}
.phead h1{font-size:24px;font-weight:600;margin:0;text-wrap:balance}
.phead .sub{color:var(--muted);font-size:14px;margin-top:2px}
.cu{display:flex;gap:6px;flex-wrap:wrap}
.cu span{font-family:var(--mono);font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);border-radius:4px;padding:1px 6px}

/* Launchpad */
.group{margin-bottom:28px}
.group h2{font-size:16px;font-weight:600;margin:0 0 10px;color:var(--fg)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.tile{background:var(--surface);border:0;box-shadow:var(--shadow);border-radius:var(--r);padding:14px 16px;text-align:left;cursor:pointer;min-height:168px;display:flex;flex-direction:column;gap:2px;transition:box-shadow .15s,transform .15s}
.tile:hover{box-shadow:0 0 0 1px var(--accent),0 4px 12px rgba(10,110,209,.15)}
.tile .t{font-weight:600;font-size:15.5px;line-height:1.25}
.tile .s{color:var(--muted);font-size:13px}
.tile .k{margin-top:auto;display:flex;align-items:baseline;gap:6px}
.tile .k b{font-size:34px;font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.tile .k b.neg{color:var(--neg)} .tile .k b.pos{color:var(--pos)} .tile .k b.warn{color:var(--warn)}
.tile .k i{font-style:normal;color:var(--muted);font-size:13px}
.tile .f{color:var(--muted);font-size:12px;margin-top:6px;font-family:var(--mono)}
@media (max-width:420px){.tiles{grid-template-columns:1fr 1fr}.tile{min-height:150px;padding:12px}.tile .k b{font-size:28px}}

/* Panels */
.card{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h3{margin:0 0 10px;font-size:16px;font-weight:600}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:12px 16px}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.kpi.neg b{color:var(--neg)} .kpi.pos b{color:var(--pos)} .kpi.warn b{color:var(--warn)}

/* Tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--surface-2);text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.r,th.r{text-align:right}
tr.sel td{background:var(--accent-soft)!important}

/* Status pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:12px;padding:1px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-pos{background:var(--pos-soft);color:var(--pos)} .p-neg{background:var(--neg-soft);color:var(--neg)}
.p-warn{background:var(--warn-soft);color:var(--warn)} .p-info{background:var(--accent-soft);color:var(--accent)}
.p-mut{background:var(--surface-2);color:var(--muted)}

/* Buttons & forms */
.btn{border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--accent-soft)}
.btn.pri{background:var(--accent);color:var(--accent-fg)} .btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent} .btn.neg{border-color:var(--neg);color:var(--neg)}
.btn.sm{padding:3px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:600}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--line);border-bottom:1px solid var(--muted);border-radius:4px;padding:6px 9px;min-width:0;width:100%}
textarea{resize:vertical;min-height:84px}
input.bad{border-color:var(--neg);background:var(--neg-soft)}
.form{display:grid;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

/* Message strips */
.strip{border-radius:6px;padding:9px 12px;font-size:14px;border:1px solid;display:flex;gap:10px;align-items:flex-start}
.strip b{font-weight:600}
.s-info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.s-pos{background:var(--pos-soft);border-color:color-mix(in srgb,var(--pos) 35%,transparent)}
.s-neg{background:var(--neg-soft);border-color:color-mix(in srgb,var(--neg) 35%,transparent)}
.s-warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Course picker */
.course{border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px}
.course-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.course-h b{font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.opt{border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:flex;gap:9px;align-items:flex-start;cursor:pointer;background:var(--surface)}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:3px}
.opt .meta{font-size:13px;color:var(--muted)}

/* Weekly schedule */
.week{display:grid;grid-template-columns:44px repeat(5,minmax(0,1fr));border:1px solid var(--line);border-radius:6px;overflow:hidden;font-size:12px}
.week .hd{background:var(--surface-2);text-align:center;padding:5px 0;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.week .hrs{position:relative}
.week .hrs div{height:26px;color:var(--muted);text-align:right;padding-right:5px;font-family:var(--mono);font-size:10.5px}
.week .day{position:relative;border-left:1px solid var(--line);background:repeating-linear-gradient(to bottom,transparent 0 25px,var(--line) 25px 26px)}
.blk{position:absolute;left:3px;right:3px;border-radius:4px;background:var(--accent-soft);border-left:3px solid var(--accent);padding:2px 5px;overflow:hidden;line-height:1.2}
.blk b{font-family:var(--mono);font-size:10.5px;font-weight:500}

/* Bars */
.bar{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar i.full{background:var(--neg)} .bar i.hi{background:var(--warn)}

/* Overlays */
.scrim{position:fixed;inset:0;background:rgba(10,18,26,.45);z-index:40;display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.3);width:min(520px,100%);max-height:90vh;overflow:auto}
.dlg h4{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px}
.dlg .bd{padding:16px 18px;display:grid;gap:12px}
.dlg .ft{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--shell);color:var(--shell-fg);padding:10px 18px;border-radius:8px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-size:14px}
.pop{position:absolute;right:0;top:46px;width:min(340px,calc(100vw - 32px));background:var(--surface);color:var(--fg);border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:45;text-align:left}
.pop h5{margin:0;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.pop ul{list-style:none;margin:0;padding:0;max-height:320px;overflow:auto}
.pop li{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px}
.pop li small{display:block;color:var(--muted);font-family:var(--mono);font-size:11px}

/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(160deg,var(--shell) 0 38%,var(--bg) 38%)}
.lbox{width:min(880px,100%);display:grid;grid-template-columns:1fr 1.1fr;background:var(--surface);border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.18);overflow:hidden}
.lbox .l{padding:30px;display:grid;gap:14px;align-content:start}
.lbox .r{padding:30px;background:var(--surface-2);display:grid;gap:10px;align-content:start}
.lbox h1{margin:0;font-size:24px;font-weight:600}
.demo{display:grid;gap:6px}
.demo button{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;cursor:pointer;text-align:left}
.demo button:hover{border-color:var(--accent)}
.demo small{color:var(--muted)}
@media (max-width:760px){.lbox{grid-template-columns:1fr}}
.msg{border-left:3px solid var(--line);padding:4px 10px;font-size:14px}
.msg.ag{border-color:var(--accent)}
.msg small{display:block;color:var(--muted);font-size:12px}
.foot{color:var(--muted);font-size:12px;text-align:center;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
// ===================== Datos de demostración =====================
const PERIODO = "2026-II";
const PASS = "demo123";
const DIAS = ["Lun","Mar","Mié","Jue","Vie"];
const CARRERAS = {SIS:{nombre:"Ingeniería de Sistemas",escuela:"Escuela de Ingeniería"},ADM:{nombre:"Administración",escuela:"Escuela de Ciencias Empresariales"}};
const ROLES = {alumno:"Alumno",docente:"Docente",secretaria:"Secretaría de Carrera",coordinador:"Coordinador Académico",soporte:"Agente de Soporte"};
const AREAS = ["Registros Académicos","Soporte Técnico","Coordinación Académica","Infraestructura"];
const CATS = {
  "Cupos":"Coordinación Académica","Cruce de horario":"Coordinación Académica",
  "Récord de notas":"Registros Académicos","Paquete de cursos":"Registros Académicos","Datos desactualizados":"Registros Académicos",
  "Desbloqueo de cuenta":"Soporte Técnico","Error técnico":"Soporte Técnico","Infraestructura":"Infraestructura"
};
const AREA_ROL = {secretaria:"Registros Académicos",coordinador:"Coordinación Académica",soporte:""};

function rng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}

function seed(){
  const r=rng(20262);
  const t0=Date.now();
  const users={
    A2026001:{cod:"A2026001",nombre:"Lucía Paredes Rojas",rol:"alumno",carrera:"SIS",tipo:"Regular",beca:"Beca 18",plan:"Plan 2023",ciclo:5,demo:"Regular · Beca 18 · apta"},
    A2026002:{cod:"A2026002",nombre:"Diego Quispe Mamani",rol:"alumno",carrera:"SIS",tipo:"Regular",beca:"Ninguna",plan:"Plan 2023",ciclo:5,demo:"Pensión pendiente y bloqueo"},
    A2026003:{cod:"A2026003",nombre:"Marco Chávez León",rol:"alumno",carrera:"SIS",tipo:"Irregular",beca:"Ninguna",plan:"Plan 2023",ciclo:5,demo:"Irregular · en espera"},
    D100:{cod:"D100",nombre:"Carlos Mendoza Vega",rol:"docente",carrera:"SIS",demo:"3 secciones a cargo"},
    D101:{cod:"D101",nombre:"Rosa Villanueva Prado",rol:"docente",carrera:"SIS"},
    D102:{cod:"D102",nombre:"Hugo Cárdenas Ríos",rol:"docente",carrera:"SIS"},
    S200:{cod:"S200",nombre:"Ana Torres Ruiz",rol:"secretaria",carrera:"SIS",demo:"Reportes, tickets y avisos"},
    C300:{cod:"C300",nombre:"Jorge Salas Pinto",rol:"coordinador",carrera:"SIS",demo:"Vacantes, colas y bloqueos"},
    T400:{cod:"T400",nombre:"Mónica Huamán Díaz",rol:"soporte",demo:"Bandeja de tickets"}
  };
  const N=["Andrea","Bruno","Camila","Daniel","Elena","Fabio","Gabriela","Hernán","Isabel","Jorge","Karen","Luis","María","Nicolás","Olga","Pablo","Rocío","Sergio","Tatiana","Víctor","Ximena","Yolanda","Renato","Fiorella","Gonzalo","Milagros","Álvaro","Pamela"];
  const L=["Quispe","Flores","Rodríguez","Sánchez","Huamán","Mendoza","Torres","Rojas","Vargas","Castillo","Ramos","Gutiérrez","Chávez","Espinoza","Salazar","Paredes","Cruz","Ccori","Apaza","Mamani","Benites","Nina"];
  for(let i=0;i<130;i++){
    const cod="A20261"+String(i).padStart(2,"0");
    const carrera=i<112?"SIS":"ADM";
    const b=r();
    users[cod]={cod,nombre:`${N[Math.floor(r()*N.length)]} ${L[Math.floor(r()*L.length)]} ${L[Math.floor(r()*L.length)]}`,rol:"alumno",carrera,
      tipo:r()<.78?"Regular":"Irregular",beca:b<.16?"Beca 18":b<.22?"Beca Excelencia":"Ninguna",plan:"Plan 2023",ciclo:5,
      retirado:r()<.05?{fecha:"2026-10-"+String(3+Math.floor(r()*20)).padStart(2,"0"),motivo:["Motivos laborales","Motivos de salud","Traslado externo","Motivos económicos"][Math.floor(r()*4)]}:null};
  }
  const cursos=[
    {cod:"IS501",nombre:"Ingeniería de Software I",cr:4},
    {cod:"IS502",nombre:"Base de Datos II",cr:4},
    {cod:"IS503",nombre:"Redes de Computadoras",cr:3},
    {cod:"IS504",nombre:"Estadística Aplicada",cr:3},
    {cod:"IS505",nombre:"Gestión de Proyectos de TI",cr:3}
  ];
  const S=(id,curso,doc,slots,tot,disp,aula)=>({id,curso,doc,slots,tot,_disp:disp,aula,mat:[]});
  const secciones=[
    S("IS501-A","IS501","D100",[[0,8,10],[2,8,10]],30,2,"B-204"),
    S("IS501-B","IS501","D101",[[1,14,16],[3,14,16]],30,0,"B-301"),
    S("IS502-A","IS502","D100",[[0,10,12],[2,10,12]],32,5,"Lab. 3"),
    S("IS502-B","IS502","D102",[[4,8,12]],28,0,"Lab. 1"),
    S("IS503-A","IS503","D102",[[1,8,10],[3,8,10]],30,12,"C-105"),
    S("IS503-B","IS503","D101",[[0,8,10],[2,8,10]],25,4,"C-106"),
    S("IS504-A","IS504","D101",[[1,10,12],[3,10,12]],30,0,"A-210"),
    S("IS504-B","IS504","D102",[[4,14,17]],30,8,"A-211"),
    S("IS505-A","IS505","D100",[[2,16,19]],28,3,"B-204")
  ];
  // llenar secciones con alumnos generados
  const pool=Object.values(users).filter(u=>u.rol==="alumno"&&u.carrera==="SIS"&&!u.demo&&!u.retirado);
  const matriculas={}; let mseq=300;
  secciones.forEach((s,k)=>{
    const need=s.tot-s._disp; let j=(k*17)%pool.length; let guard=0;
    while(s.mat.length<need&&guard<500){const a=pool[j%pool.length];j++;guard++;
      const m=matriculas[a.cod];

// CU-04 Verificar pagos e impedimentos
function verificar(cod){
  const u=U(cod), motivos=[];
  const pend=D.pagos.filter(p=>p.alu===cod&&!p.pagado&&p.tipo!=="matricula");
  pend.forEach(p=>motivos.push(`${p.concepto} pendiente (${money(p.monto)})`));
  D.imp.filter(i=>i.alu===cod&&i.activo).forEach(i=>motivos.push(`Impedimento ${i.tipo.toLowerCase()}: ${i.desc}`));
  if(u.retirado)motivos.push("Alumno con condición de retiro");
  return {apto:motivos.length===0,motivos,beca:u.beca,t:Date.now()};
}

// Asignar vacantes libres a la cola en orden de llegada
function asignarCola(secId){
  const s=sec(secId); let n=0;
  while(disp(s)>0){const q=colaActiva(secId);if(!q.length)break;const sol=q[0];
    if(!verificar(sol.alu).apto){sol.estado="Retirada";notify(sol.alu,`Tu solicitud en ${secId} se retiró: no estás apto para matricularte.`);continue;}
    matricular(sol.alu,secId);sol.estado="Matriculado";n++;
    notify(sol.alu,`Se liberó una vacante: quedaste matriculado en ${secId} (${curso(s.curso).nombre}).`);}
  return n;
}
function matricular(alu,secId){
  const s=sec(secId); if(!s.mat.includes(alu))s.mat.push(alu);
  let m=D.matriculas[alu];
  if(!m)m=D.matriculas[alu]={id:"M-"+(++D.seq.mat),fecha:Date.now(),estado:"Matriculado",secciones:[]};
  m.secciones=m.secciones.filter(x=>sec(x).curso!==s.curso); m.secciones.push(secId);
  D.notas[secId]=D.notas[secId]||{}; D.notas[secId][alu]=D.notas[secId][alu]||{ec:null,ep:null,ef:null};
  D.asis[secId]=D.asis[secId]||{}; D.asis[secId][alu]=D.asis[secId][alu]??100;
}

function week(mine,pre){
  const H0=8,H1=20,RH=26;
  const hrs=[];for(let h=H0;h<H1;h++)hrs.push(`<div>${pad(h)}</div>`);
  const cols=DIAS.map((d,di)=>{const blocks=[];
    const add=(id,tent)=>sec(id).slots.filter(s=>s[0]===di).forEach(([,a,b])=>blocks.push(`<div class="blk" style="top:${(a-H0)*RH}px;height:${(b-a)*RH-2}px;${tent?"border-left-style:dashed;opacity:.7":""}"><b>${id}</b></div>`));
    mine.forEach(id=>add(id,false));[...new Set(pre)].filter(id=>!mine.includes(id)).forEach(id=>add(id,true));
    return `<div class="day" style="height:${(H1-H0)*RH}px">${blocks.join("")}</div>`});
  return `<div class="week"><div class="hd"></div>${DIAS.map(d=>`<div class="hd">${d}</div>`).join("")}<div class="hrs">${hrs.join("")}</div>${cols.join("")}</div>
    <p class="muted small" style="margin:8px 0 0">Bloques con borde punteado: secciones sin cupo asegurado.</p>`;
}
// Registra las secciones elegidas como solicitudes En cola (CU-03)
function matricularFlow(){
  const c=UI.user,v=verificar(c);
  if(!v.apto){UI.matMsg={ok:false,title:"No puedes iniciar la matrícula. Regulariza lo siguiente:",list:v.motivos};render();return}
  const picks=Object.values(UI.sel).filter(Boolean);
  const mine=(D.matriculas[c]||{secciones:[]}).secciones;
  const held=D.sols.filter(s=>s.alu===c&&activa(s)).map(s=>s.sec);
  const all=[...mine,...held,...picks],conf=[];
  for(let i=0;i<all.length;i++)for(let j=i+1;j<all.length;j++){
    if(sec(all[i]).slots.some(a=>sec(all[j]).slots.some(b=>overlap(a,b))))conf.push(`${all[i]} y ${all[j]} se cruzan en horario`);}
  if(conf.length){UI.matMsg={ok:false,title:"Hay cruces de horario. Elige otra sección:",list:conf};render();return}
  const cr=all.reduce((a,id)=>a+curso(sec(id).curso).cr,0);
  if(cr>22){UI.matMsg={ok:false,title:`Superas el máximo de 22 créditos (${cr}).`};render();return}
  picks.forEach(id=>D.sols.push({id:"SC-"+(++D.seq.sol),alu:c,sec:id,fecha:Date.now(),estado:"En cola"}));
  let pm=pagoMat(c);
  if(!pm){D.pagos.push(pm={id:"PG-"+(++D.seq.pago),alu:c,concepto:`Derecho de matrícula ${PERIODO}`,monto:250,pagado:false,fecha:null,nota:"",tipo:"matricula"})}
  UI.sel={};
  if(pm.pagado){const r=procesarPago(c);UI.matMsg={ok:true,title:resumen(r)};}
  else{UI.matMsg={ok:true,title:`Solicitudes registradas En cola: ${picks.join(", ")}. Paga el derecho de matrícula para asegurar tus cupos.`};
    notify(c,`Registraste ${picks.length} solicitud(es) en cola. Recuerda pagar el derecho de matrícula antes del cierre.`);}
  save();render();
}
// Al pagar, cada solicitud En cola obtiene cupo si hay vacante libre; si no, pasa a En espera (CU-05)
function procesarPago(c){
  const ok=[],esp=[];
  D.sols.filter(s=>s.alu===c&&s.estado==="En cola").sort((a,b)=>a.fecha-b.fecha).forEach(s=>{
    const x=sec(s.sec);
    if(disp(x)>0&&colaActiva(x.id).length===0){matricular(c,x.id);s.estado="Matriculado";ok.push(x.id)}
    else{s.estado="En espera";s.fecha=s.fecha;esp.push(x.id)}});
  if(ok.length)notify(c,`Cupo asegurado en ${ok.join(", ")}.`);
  if(esp.length)notify(c,`Sin vacantes en ${esp.join(", ")}: quedaste En espera por orden de llegada.`);
  return {ok,esp};
}
function resumen(r){return (r.ok.length?`Cupo asegurado en ${r.ok.join(", ")}. `:"")+(r.esp.length?`En espera de vacante: ${r.esp.join(", ")}.`:"")||"Pago registrado."}
function pagarMatricula(c){
  const pm=pagoMat(c); if(!pm||pm.pagado)return;
  const v=verificar(c); if(!v.apto){toast("Primero regulariza tus deudas e impedimentos.");return}
  pm.pagado=true;pm.fecha=Date.now();
  const r=procesarPago(c);UI.matMsg={ok:true,title:"Pago registrado. "+resumen(r)};
  save();render();toast("El Sistema de Pagos confirmó el pago de matrícula.");
}

function tipoOk(u,R){return R.tipoAl==="Todos"||(R.tipoAl==="Solo regulares"?u.tipo==="Regular":u.tipo==="Irregular")}
function becaOk(u,R){if(!tipoOk(u,R))return false;if(!R.beca)return true;if(R.becaTipo==="Cualquier beca")return u.beca!=="Ninguna";return u.beca===R.becaTipo}
function reportRows(R){
  const al=Object.values(D.users).filter(u=>u.rol==="alumno"&&u.carrera===R.carrera&&becaOk(u,R));
  if(R.tipo==="Alumnos retirados"){
    return {cols:["Código","Alumno","Tipo","Beca","Fecha de retiro","Motivo"],num:[],data:al.filter(u=>u.retirado).map(u=>[u.cod,u.nombre,u.tipo,u.beca,u.retirado.fecha,u.retirado.motivo])};}
  const secs=D.secciones.filter(s=>(!R.curso||s.curso===R.curso)&&curso(s.curso)&&R.carrera==="SIS");
  const set=new Set(al.map(u=>u.cod)),data=[];
  secs.forEach(s=>s.mat.filter(a=>set.has(a)).forEach(a=>{const u=U(a);
    if(R.tipo==="Asistencia")data.push([a,u.nombre,s.id,curso(s.curso).nombre,u.beca,D.asis[s.id][a]+"%"]);

      data.push([a,u.nombre,s.id,u.beca,n.ec??"—",n.ep??"—",n.ef??"—",p]);}}));
  data.sort((x,y)=>x[1].localeCompare(y[1]));
  return R.tipo==="Asistencia"?{cols:["Código","Alumno","Sección","Curso","Beca","Asistencia"],num:[5],data}

}

      if(mot.length<8){document.getElementById("exErr").innerHTML=`<div class="strip s-neg">Escribe el motivo (mínimo 8 caracteres).</div>`;return}
      if(disp(s)<=0){document.getElementById("exErr").innerHTML=`<div class="strip s-neg">Sin vacantes en ${r.sec}. Amplíalas antes de reasignar.</div>`;return}
      matricular(r.alu,r.sec);r.estado="Matriculado";
      notify(r.alu,`Coordinación te asignó un cupo en ${r.sec} por excepción.`);
      audit(`Excepción: ${r.alu} matriculado en ${r.sec} fuera de orden. Motivo: ${mot}`);
      save();closeDlg();render();toast(`Cupo reasignado a ${U(r.alu).nombre}.`)}}]);
}

// ---------- CU-09 Bandeja ----------
function vBandeja(){
  const F=UI.bf||{estado:"Pendientes",area:AREA_ROL[U(UI.user).rol]||""};UI.bf=F;
  let list=misTickets().slice().sort((a,b)=>b.creado-a.creado);
  if(F.estado==="Pendientes")list=list.filter(t=>t.estado!=="Resuelto");else if(F.estado)list=list.filter(t=>t.estado===F.estado);
  if(F.area)list=list.filter(t=>t.area===F.area);
  const res=misTickets().filter(t=>t.resuelto);const avg=res.length?res.reduce((a,t)=>a+(t.resuelto-t.creado),0)/res.length/36e5:0;
  const t=UI.bandSel&&D.tickets.find(x=>x.num===UI.bandSel);
  const mt=misTickets();
  return `<div class="kpis"><div class="kpi warn"><span>Abiertos</span><b>${mt.filter(x=>x.estado==="Abierto").length}</b></div>
    <div class="kpi"><span>En revisión</span><b>${mt.filter(x=>x.estado==="En revisión"||x.estado==="Info solicitada").length}</b></div>
    <div class="kpi pos"><span>Resueltos</span><b>${res.length}</b></div><div class="kpi"><span>Tiempo medio de atención</span><b>${avg.toFixed(1)} h</b></div></div>
  <div class="grid2"><div class="card"><div class="row" style="margin-bottom:10px">
    <div class="field"><label for="bfe">Estado</label><select id="bfe" data-bf="estado">${["Pendientes","Abierto","En revisión","Info solicitada","Resuelto",""].map(x=>`<option value="${x}" ${F.estado===x?"selected":""}>${x||"Todos"}</option>`).join("")}</select></div>
    <div class="field"><label for="bfa">Área</label><select id="bfa" data-bf="area"><option value="">Todas</option>${AREAS.map(a=>`<option ${F.area===a?"selected":""}>${a}</option>`).join("")}</select></div></div>
   ${list.length?`<div class="tw"><table><thead><tr><th>Ticket</th><th>Categoría</th><th>Remitente</th><th>Área</th><th>Estado</th><th>Creado</th></tr></thead><tbody>
    ${list.map(x=>`<tr class="${UI.bandSel===x.num?"sel":""}" style="cursor:pointer" data-act="abrirTicket" data-n="${x.num}" tabindex="0"><td class="mono">#${x.num}</td><td>${esc(x.cat)}</td><td>${esc(U(x.user).nombre)}<div class="small muted">${ROLES[U(x.user).rol]}</div></td><td class="small">${esc(x.area)}</td><td>${estPill(x.estado)}</td><td class="num small">${fDT(x.creado)}</td></tr>`).join("")}</tbody></table></div>`
    :`<p class="muted" style="margin:0">No hay tickets con estos filtros.</p>`}</div>
  <div class="card">${t?`<div class="row" style="justify-content:space-between"><h3 style="margin:0">Ticket #${t.num}</h3>${estPill(t.estado)}</div>
     <table style="margin:10px 0"><tr><td class="muted">Remitente</td><td>${esc(U(t.user).nombre)} <span class="mono small">${t.user}</span></td></tr><tr><td class="muted">Categoría</td><td>${esc(t.cat)}</td></tr>
     <tr><td class="muted">Área</td><td><select id="tarea" data-act="reasignarArea" data-n="${t.num}" ${t.estado==="Resuelto"?"disabled":""}>${AREAS.map(a=>`<option ${a===t.area?"selected":""}>${a}</option>`).join("")}</select></td></tr>
     <tr><td class="muted">Creado</td><td class="num">${fDT(t.creado)}</td></tr>${t.resuelto?`<tr><td class="muted">Atención</td><td class="num">${((t.resuelto-t.creado)/36e5).toFixed(1)} h</td></tr>`:""}</table>
     <div class="stack" style="gap:8px"><div>${esc(t.desc)}</div>${t.msgs.map(m=>`<div class="msg ${esStaff(m.who)?"ag":""}"><small>${esc(U(m.who).nombre)} · ${fDT(m.t)}</small>${esc(m.text)}</div>`).join("")}</div>
     ${t.estado!=="Resuelto"?`<div class="field" style="margin-top:12px"><label for="tresp">Respuesta</label><textarea id="tresp" placeholder="Escribe la solución o la información que necesitas."></textarea></div>
     <div class="row" style="margin-top:10px"><button class="btn" data-act="pedirInfo" data-n="${t.num}">Solicitar información</button><button class="btn pri" data-act="resolver" data-n="${t.num}">Resolver ticket</button></div>`:""}`
    :`<p class="muted" style="margin:0">Selecciona un ticket para atenderlo.</p>`}</div></div>`;
}
function misTickets(){const u=U(UI.user);return u.rol==="soporte"?D.tickets:D.tickets.filter(t=>U(t.user).carrera===u.carrera)}
const esStaff=c=>["soporte","secretaria","coordinador"].includes(U(c).rol);
function ticketAct(n,kind){
  const t=D.tickets.find(x=>x.num===n),txt=(document.getElementById("tresp")||{}).value?.trim()||"";
  if(txt.length<5){toast("Escribe una respuesta antes de continuar.");return}
  t.msgs.push({who:UI.user,text:txt,t:Date.now()});t.agente=UI.user;
  if(kind==="resolver"){t.estado="Resuelto";t.resuelto=Date.now();notify(t.user,`Tu ticket #${n} fue resuelto.`);toast(`Ticket #${n} resuelto.`)}
  else{t.estado="Info solicitada";notify(t.user,`Soporte necesita más información en tu ticket #${n}.`);toast(`Se pidió información al remitente del #${n}.`)}
  save();render();
}

// ---------- Avisos masivos (Secretaría) ----------
const CIERRE=new Date(2026,10,20,23,59).getTime(); // cierre de la matrícula regular 2026-II
const GRUPOS={"Todos los alumnos de mi escuela":u=>true,"Alumnos en matrícula extemporánea":u=>D.sols.some(s=>s.alu===u.cod&&s.fecha>CIERRE),"Alumnos con solicitudes pendientes de pago":u=>D.sols.some(s=>s.alu===u.cod&&s.estado==="En cola"),
  "Alumnos En espera de vacante":u=>D.sols.some(s=>s.alu===u.cod&&s.estado==="En espera"),"Alumnos irregulares":u=>u.tipo==="Irregular",
  "Becarios (Beca 18 y otras)":u=>u.beca!=="Ninguna"};
const PLANTILLAS={cierre:["Cierre de matrícula","La matrícula 2026-II cierra el 20/11/2026 a las 23:59. Completa tu pago para asegurar tus cupos."],
  extemp:["Matrícula extemporánea","La matrícula extemporánea será del 21 al 23/11/2026 y tiene un recargo. Regulariza antes del cierre para evitarlo."],
  turnos:["Turnos asignados","Ya puedes consultar tu turno de inscripción en el portal. Recuerda matricularte dentro de tu horario."]};
function destinatarios(g){const u=U(UI.user);return Object.values(D.users).filter(x=>x.rol==="alumno"&&x.carrera===u.carrera&&!x.retirado&&GRUPOS[g](x))}
function vAvisos(){
  const g=UI.avG||Object.keys(GRUPOS)[0],n=destinatarios(g).length,P=UI.avP||["",""];
  return `<div class="grid2"><form class="card form" id="avisoForm"><h3 style="margin:0">Nuevo aviso</h3>
    <div class="row small"><span class="muted">Plantillas:</span>${Object.entries(PLANTILLAS).map(([k,v])=>`<button type="button" class="btn sm" data-act="plantilla" data-k="${k}">${v[0]}</button>`).join("")}</div>
    <div class="field"><label for="avg">Destinatarios</label><select id="avg" data-act="avGrupo">${Object.keys(GRUPOS).map(k=>`<option ${k===g?"selected":""}>${k}</option>`).join("")}</select>${n?`<span class="small muted num">${n} estudiantes recibirán el aviso</span>`:`<div class="strip s-warn small">Ningún estudiante pertenece a este grupo en este momento${g==="Alumnos en matrícula extemporánea"?": la matrícula regular sigue abierta hasta el 20/11/2026":""}. Elige otro grupo para habilitar el envío.</div>`}</div>
    <div class="field"><label for="ava">Asunto</label><input type="text" id="ava" value="${esc(P[0])}" placeholder="Ej. Cierre de matrícula"></div>
    <div class="field"><label for="avm">Mensaje</label><textarea id="avm" placeholder="Escribe el aviso.">${esc(P[1])}</textarea></div>
    ${UI.avErr?`<div class="strip s-neg">${esc(UI.avErr)}</div>`:""}
    <div><button class="btn pri" type="submit" ${n?"":"disabled"}>Enviar aviso</button></div>
    <p class="muted small" style="margin:0">El aviso llega como notificación en el portal. El envío por correo institucional queda para una siguiente versión.</p></form>
  <div class="card"><h3>Avisos enviados</h3>${D.avisos.length?`<div class="tw"><table><thead><tr><th>Asunto</th><th>Destinatarios</th><th class="r">Alumnos</th><th>Fecha</th></tr></thead><tbody>
    ${D.avisos.map(a=>`<tr><td>${esc(a.asunto)}</td><td class="small">${esc(a.grupo)}</td><td class="r num">${a.n}</td><td class="num small">${fDT(a.t)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted" style="margin:0">Aún no se enviaron avisos.</p>`}</div></div>`;
}
function enviarAviso(){
  const g=document.getElementById("avg").value,a=document.getElementById("ava").value.trim(),m=document.getElementById("avm").value.trim();
  UI.avP=[a,m];
  if(!a||m.length<10){UI.avErr="Escribe un asunto y un mensaje de al menos 10 caracteres.";render();return}
  const ds=destinatarios(g);ds.forEach(u=>notify(u.cod,`${a}: ${m}`));
  D.avisos.unshift({asunto:a,grupo:g,n:ds.length,t:Date.now(),user:UI.user});
  UI.avErr="";UI.avP=null;save();render();toast(`Aviso enviado a ${ds.length} estudiantes.`);
}

// ---------- Bloqueos de matrícula (Coordinación) ----------
function bloqueosCarrera(){const u=U(UI.user);return D.imp.filter(i=>U(i.alu).carrera===u.carrera)}
function vBloqueos(){
  const list=bloqueosCarrera(),act=list.filter(i=>i.activo),hist=list.filter(i=>!i.activo);
  return `<div class="stack"><div class="card"><h3>Bloqueos activos</h3>${act.length?`<div class="tw"><table><thead><tr><th>Alumno</th><th>Tipo</th><th>Motivo del bloqueo</th><th>Deudas</th><th></th></tr></thead><tbody>
    ${act.map(i=>{const v=D.pagos.filter(p=>p.alu===i.alu&&!p.pagado&&p.tipo!=="matricula");return `<tr><td>${esc(U(i.alu).nombre)}<div class="small muted mono">${i.alu}</div></td><td>${pill(i.tipo,"warn")}</td><td>${esc(i.desc)}</td>
    <td class="small">${v.length?pill(v.length+" pendiente(s)","neg"):"Ninguna"}</td><td><button class="btn sm" data-act="levantar" data-id="${i.id}">Levantar bloqueo</button></td></tr>`}).join("")}</tbody></table></div>`
    :`<p class="muted" style="margin:0">No hay bloqueos activos en tu carrera.</p>`}
    <p class="muted small" style="margin:10px 0 0">Las deudas no se levantan aquí: se regularizan con el pago del alumno.</p></div>
   ${hist.length?`<div class="card"><h3>Bloqueos levantados</h3><div class="tw"><table><thead><tr><th>Alumno</th><th>Bloqueo</th><th>Motivo de la regularización</th><th>Fecha</th></tr></thead><tbody>
    ${hist.map(i=>`<tr><td>${esc(U(i.alu).nombre)}</td><td class="small">${esc(i.desc)}</td><td class="small">${esc(i.lev?i.lev.motivo:"")}</td><td class="num small">${i.lev?fDT(i.lev.t):""}</td></tr>`).join("")}</tbody></table></div></div>`:""}</div>`;
}
function levantar(id){
  const i=D.imp.find(x=>x.id===id);
  dialog("Levantar bloqueo",`<p style="margin:0"><b>${esc(U(i.alu).nombre)}</b> · ${esc(i.desc)}</p>
    <div class="field"><label for="lvMot">Motivo de la regularización (obligatorio)</label><textarea id="lvMot" placeholder="Ej. Presentó los documentos el 10/11/2026."></textarea></div><div id="lvErr"></div>`,
    [{t:"Cancelar",a:closeDlg},{t:"Levantar bloqueo",pri:true,a:()=>{const m=document.getElementById("lvMot").value.trim();
      if(m.length<8){document.getElementById("lvErr").innerHTML=`<div class="strip s-neg">Escribe el motivo (mínimo 8 caracteres).</div>`;return}
      i.activo=false;i.lev={by:UI.user,motivo:m,t:Date.now()};
      notify(i.alu,`Coordinación levantó tu bloqueo: ${i.desc}.`);audit(`Bloqueo levantado a ${i.alu}: ${i.desc}. Motivo: ${m}`);
      save();closeDlg();render();toast(`Bloqueo levantado a ${U(i.alu).nombre}.`)}}]);
}

// ===================== Diálogo =====================
let dlgActs=[];
function dialog(title,body,acts){
  dlgActs=acts;
  document.getElementById("ov").innerHTML=`<div class="scrim" data-act="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h4>${esc(title)}</h4><div class="bd">${body}</div>
    <div class="ft">${acts.map((a,i)=>`<button class="btn ${a.pri?"pri":""}" data-dlg="${i}">${esc(a.t)}</button>`).join("")}</div></div></div>`;
  const f=document.querySelector(".dlg textarea,.dlg [data-dlg]");f&&f.focus();
}
function closeDlg(){document.getElementById("ov").innerHTML=""}

// ===================== Eventos =====================
document.addEventListener("click",e=>{
  const d=e.target.closest("[data-dlg]");if(d){dlgActs[+d.dataset.dlg].a();return}
  if(e.target.matches(".scrim")){closeDlg();return}
  const el=e.target.closest("[data-act]");
  if(UI.showNot&&!(el&&el.dataset.act==="notifs")&&!e.target.closest(".pop")){UI.showNot=false;render();}
  if(!el)return;const a=el.dataset.act;
  switch(a){
    case"pick":UI.lcod=el.dataset.cod;UI.loginErr="";render();setTimeout(()=>{const p=document.getElementById("lpass");p&&p.focus()},0);break;
    case"home":go("home");break;
    case"go":UI.matMsg=null;UI.turnoMsg=null;go(el.dataset.v);break;
    case"help":UI.helpOpen=!UI.helpOpen;render();break;
    case"logout":stopSim();UI={...UI,user:null,view:"login",lcod:"",showNot:false,sel:{},repo:null,bf:null,bandSel:null,cargaSec:null,notasSec:null,secSel:null};render();break;
    case"reset":dialog("Restablecer datos","<p style='margin:0'>Se borrarán matrículas, tickets, colas y cambios hechos en esta demostración. Esta acción no se puede deshacer.</p>",
      [{t:"Cancelar",a:closeDlg},{t:"Restablecer",pri:true,a:()=>{stopSim();D=seed();save();closeDlg();UI.sel={};render();toast("Datos de demostración restablecidos.")}}]);break;
    case"notifs":UI.showNot=!UI.showNot;if(UI.showNot)setTimeout(()=>{D.notifs.forEach(n=>{if(n.user===UI.user)n.read=true});save()},50);render();break;
    case"pedirTurno":pedirTurno();break;
    case"matricular":matricularFlow();break;
    case"retirarCola":{const s=D.sols.find(x=>x.id===el.dataset.id);
      dialog("Retirarte de la cola",`<p style='margin:0'>Saldrás de la cola de <b class="mono">${s.sec}</b>${s.estado==="En espera"?` y perderás tu posición (${posicion(s)})`:""}.</p>`,
        [{t:"Cancelar",a:closeDlg},{t:"Retirarme",pri:true,a:()=>{s.estado="Retirada";save();closeDlg();render();toast(`Saliste de la cola de ${s.sec}.`)}}]);break;}
    case"pagarMat":pagarMatricula(UI.user);break;
    case"plantilla":UI.avP=PLANTILLAS[el.dataset.k].slice();UI.avErr="";render();break;
    case"levantar":levantar(el.dataset.id);break;
    case"pagar":{const p=D.pagos.find(x=>x.id===el.dataset.id);p.pagado=true;p.fecha=Date.now();notify(UI.user,`Pago registrado: ${p.concepto}.`);save();render();toast("El Sistema de Pagos confirmó el pago.");break;}
    case"replyTicket":{const n=+el.dataset.n,inp=document.getElementById("rep_"+n),t=D.tickets.find(x=>x.num===n);
      if(!inp.value.trim())return;t.msgs.push({who:UI.user,text:inp.value.trim(),t:Date.now()});if(t.estado==="Info solicitada")t.estado="En revisión";save();render();break;}
    case"verLista":UI.cargaSec=el.dataset.id;render();break;
    case"guardarNotas":guardarNotas();break;
    case"exportar":exportar();break;
    case"sim":UI.sim?stopSim():(UI.sim=setInterval(simTick,1500));render();break;
    case"gestionar":UI.secSel=el.dataset.id;go("vacantes");break;
    case"saveVac":saveVac(el.dataset.id);break;
    case"excep":excepcion(el.dataset.id);break;
    case"abrirTicket":{const t=D.tickets.find(x=>x.num===+el.dataset.n);UI.bandSel=t.num;if(t.estado==="Abierto"){t.estado="En revisión";t.agente=UI.user;save()}render();break;}
    case"resolver":ticketAct(+el.dataset.n,"resolver");break;
    case"pedirInfo":ticketAct(+el.dataset.n,"info");break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){closeDlg();if(UI.showNot){UI.showNot=false;render()}}
  if(e.key==="Enter"&&e.target.matches("tr[data-act]"))e.target.click();
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.act==="selsec"){UI.sel[el.dataset.c]=el.value;UI.matMsg=null;render();return}
  if(el.dataset.act==="notasSec"){UI.notasSec=el.value;render();return}
  if(el.dataset.act==="avGrupo"){UI.avG=el.value;UI.avP=[document.getElementById("ava").value,document.getElementById("avm").value];render();return}
  if(el.dataset.act==="reasignarArea"){const t=D.tickets.find(x=>x.num===+el.dataset.n);t.area=el.value;save();render();toast(`Ticket #${t.num} reasignado a ${el.value}.`);return}
  if(el.dataset.rf){const k=el.dataset.rf;UI.repo[k]=el.type==="checkbox"?el.checked:el.value;if(k==="tipo"&&el.value==="Alumnos retirados")UI.repo.curso="";render();return}
  if(el.dataset.bf){UI.bf[el.dataset.bf]=el.value;render();return}
});
document.addEventListener("input",e=>{
  const el=e.target;if(!el.classList.contains("nota"))return;
  el.classList.toggle("bad",!validNota(el.value.trim()));
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="loginForm")doLogin();
  if(e.target.id==="ticketForm")crearTicket();
  if(e.target.id==="secForm")crearSeccion();
  if(e.target.id==="avisoForm")enviarAviso();
});
function stopSim(){if(UI.sim){clearInterval(UI.sim);UI.sim=null}}
// refresco "en tiempo real" de colas y panel
setInterval(()=>{if(UI.user&&["colas","panel"].includes(UI.view)&&!document.querySelector(".scrim")&&!UI.sim&&!(document.activeElement&&document.activeElement.matches("input,select,textarea")))render()},5000);
render();
</script>
